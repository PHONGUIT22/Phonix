# Phonix v2.0 - Hardware Execution Profile
# Calibrated for edge / developer workstation with 1.2GB VRAM cap and deterministic memory limits

profile_name: "workstation_edge_1b"
device_target: "auto" # options: "cuda", "metal", "cpu", "auto"

# Local 1B Micro-Router Resource Envelope
router_slm:
  model_id: "meta-llama/Llama-3.2-1B-Instruct"
  local_model_path: "models/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
  quantization: "Q4_K_M"
  vram_budget_mb: 1228.8 # 1.2 GB strictly enforced
  gpu_layers_offload: 16
  cpu_threads: 4
  context_window_tokens: 4096
  temperature: 0.0 # Deterministic GBNF decoding
  top_p: 1.0
  repeat_penalty: 1.1

# Context MMU (Memory Management Unit) Constraints
mmu:
  max_ast_frame_tokens: 512
  frame_cache_max_frames: 2048
  speculative_trie_max_nodes: 100000
  pinned_kv_prefix_budget_tokens: 256
  call_graph_max_hops: 2
  eviction_strategy: "lru_with_priority" # options: "lru", "priority", "lru_with_priority"

# KV Cache Prefix Management
kv_prefix:
  enabled: true
  pinned_system_prompts: true
  pinned_schema_tokens: 128
  eviction_threshold_percent: 90
